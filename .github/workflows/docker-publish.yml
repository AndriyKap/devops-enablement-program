name: Build .NET Docker Image

on:
  pull_request:
  push:
    branches:
      - feature/m04-docker
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and publish test tags to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/DevOpsLab.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/andriykap/devopslab-api:m04-sha-${{ github.sha }}
            ghcr.io/andriykap/devopslab-api:m04-test
          labels: |
            org.opencontainers.image.source=https://github.com/AndriyKap/devops-enablement-program
          secrets: |
            nuget_token=dummy-test-token
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      # M04 learning scan: report HIGH/CRITICAL findings without failing on vulnerabilities.
      # The action is pinned by commit SHA due to the March 2026 supply-chain incident.
      - name: Trivy scan (GHCR image)
        if: ${{ github.event_name == 'push' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/andriykap/devopslab-api:m04-sha-${{ github.sha }}
          scan-type: image
          version: v0.76.2
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Docker Hub publishing is opt-in. Set repo variables and token, then enable.
      - name: Login to Docker Hub
        if: ${{ github.event_name == 'push' && vars.DOCKERHUB_PUBLISH_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image and publish test tags to Docker Hub
        if: ${{ github.event_name == 'push' && vars.DOCKERHUB_PUBLISH_ENABLED == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/DevOpsLab.Api/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devopslab-api:m04-sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/devopslab-api:m04-test
          labels: |
            org.opencontainers.image.source=https://github.com/AndriyKap/devops-enablement-program
          secrets: |
            nuget_token=dummy-test-token
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Verify Docker Hub image manifest
        if: ${{ github.event_name == 'push' && vars.DOCKERHUB_PUBLISH_ENABLED == 'true' }}
        run: docker buildx imagetools inspect "${{ vars.DOCKERHUB_USERNAME }}/devopslab-api:m04-test"
