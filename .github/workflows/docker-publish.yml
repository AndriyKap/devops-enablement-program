name: Build .NET Docker Image

on:
  pull_request:
  push:
    branches:
      - feature/m04-docker
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and publish test tags to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/DevOpsLab.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/andriykap/devopslab-api:m04-sha-${{ github.sha }}
            ghcr.io/andriykap/devopslab-api:m04-test
          labels: |
            org.opencontainers.image.source=https://github.com/AndriyKap/devops-enablement-program
          secrets: |
            nuget_token=dummy-test-token
          build-args: |
            COMMIT_SHA=${{ github.sha }}
