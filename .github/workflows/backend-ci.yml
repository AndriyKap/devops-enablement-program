name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsLab.slnx

      - name: Build solution
        run: dotnet build DevOpsLab.slnx --configuration Release --no-restore

      - name: Upload test-binaries
        uses: actions/upload-artifact@v4
        with:
          name: test-binaries
          path: tests/DevOpsLab.Tests/bin/Release/net10.0/
          if-no-files-found: error

      - name: Publish API
        run: dotnet publish src/DevOpsLab.Api/DevOpsLab.Api.csproj --configuration Release --no-build --output artifacts/api

      - name: Upload api-publish
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: artifacts/api/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: devops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d devops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download test-binaries
        uses: actions/download-artifact@v4
        with:
          name: test-binaries
          path: test-binaries

      - name: Run tests from compiled DLL
        env:
          TEST_DATABASE_CONNECTION: Host=localhost;Port=5432;Database=devops_test;Username=devops;Password=testpassword
        run: >
          dotnet test test-binaries/DevOpsLab.Tests.dll
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload TRX test results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: test-results-trx
          path: TestResults/*.trx
          if-no-files-found: error
