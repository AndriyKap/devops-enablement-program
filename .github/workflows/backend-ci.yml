name: Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore DevOpsLab.slnx

      - name: Build solution
        run: dotnet build DevOpsLab.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DevOpsLab.slnx --configuration Release --no-build --no-restore
