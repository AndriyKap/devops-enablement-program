name: Simulated Multi-Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Оберіть середовище для деплою'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
  # Temporary branch-only trigger for M03 evidence without merging into main.
  push:
    branches:
      - feature/m03-secrets-variables
    paths:
      - '.github/workflows/simulated-multi-environment-deploy.yml'

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Manual runs select one environment; branch smoke tests check dev + production.
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","production"]') }}
    environment:
      name: ${{ matrix.target }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Run simulated deployment
        env:
          TARGET_ENV: ${{ matrix.target }}
          TARGET_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::APP_URL is not configured for $TARGET_ENV"
            exit 1
          fi

          echo "Environment: $TARGET_ENV"
          echo "URL: $TARGET_URL"
          echo "Status: Simulation successful"
