name: Simulated Multi-Environment Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Оберіть середовище для деплою'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - production
  # Temporary branch-only trigger for M03 evidence without merging into main.
  push:
    branches:
      - feature/m03-secrets-variables
    paths:
      - '.github/workflows/simulated-multi-environment-deploy.yml'
      - '.github/workflows/reusable-deploy.yml'

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ matrix.target }}
    strategy:
      fail-fast: false
      # Manual runs select one environment; branch smoke tests check dev + staging; production approval is separately verified.
      matrix:
        target: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["dev","staging"]') }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      target_environment: ${{ matrix.target }}
    secrets:
      demo_token: ${{ secrets.DEMO_API_TOKEN }}
